# Copy this file into the repo you want to protect (e.g. shraddha-store/.github/workflows/patchpilot.yml).
name: PatchPilot

on:
  schedule:
    - cron: "17 13 * * 1"   # every Monday 13:17 UTC
  workflow_dispatch:         # plus a "Run workflow" button for manual runs

permissions:
  contents: read             # least privilege by default; only the second job may write issues

jobs:
  scan:                      # job 1: read-only. Finds problems, writes report.json, changes nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/SidVelagapalli/patchpilot"
      - run: patchpilot scan --path . --out report.json
      - uses: actions/upload-artifact@v4
        with:
          name: patchpilot-report
          path: report.json

  file-issues:               # job 2: writes. Waits for a human to click "Approve" before it runs.
    needs: scan
    runs-on: ubuntu-latest
    environment: patchpilot-approval   # Settings -> Environments -> add yourself as a required reviewer
    permissions:
      issues: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/SidVelagapalli/patchpilot"
      - uses: actions/download-artifact@v4
        with:
          name: patchpilot-report
      - run: patchpilot file-issues --report report.json --repo "${{ github.repository }}" --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Paid LLM summaries are opt-in: add --llm above and ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} here.
