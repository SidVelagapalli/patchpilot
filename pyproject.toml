[project]
name = "patchpilot"
version = "0.1.0"
description = "Scheduled agent that finds known-vulnerable dependencies and files GitHub issues behind a human approval gate"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=0.40"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
